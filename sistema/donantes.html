<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Donantes - MediSign</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
    <link rel="stylesheet" href="/static/css/principal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dashboard-layout" data-auth="true">

<aside class="sidebar">
    <div class="sidebar-header"><i class="fa-solid fa-file-signature"></i> MediSign</div>
    <nav class="nav-menu">
        <a href="/static/dashboard.html" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Inicio</a>
        <a href="/static/sistema/donantes.html" class="menu-item active"><i class="fa-solid fa-users"></i> Donantes</a>
        <a href="/static/sistema/donaciones.html" class="menu-item"><i class="fa-solid fa-syringe"></i> Donaciones</a>
        <a href="/static/sistema/inventario.html" class="menu-item"><i class="fa-solid fa-droplet"></i> Inventario</a>
    </nav>
    <button id="btnLogout" class="logout-btn"><i class="fa-solid fa-power-off"></i> Cerrar Sesión</button>
</aside>

<main class="main-content">
    <h2 class="page-title">Gestión de Donantes y Donaciones</h2>

    <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 40px;">
        
        <div class="form-panel">
            <h3>Registrar Nuevo Donante</h3>
            <form id="donanteForm" style="margin-top: 15px;">
                <div class="form-row">
                    <div class="form-group"><label>Nombres</label><input type="text" id="nombre" required></div>
                    <div class="form-group"><label>Apellidos</label><input type="text" id="apellido" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Documento</label><input type="text" id="documento" required></div>
                    <div class="form-group"><label>Fecha Nacimiento</label><input type="date" id="fechaNacimiento" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tipo de Sangre</label>
                        <select id="tipoSangre" required>
                            <option value="O_POSITIVO">O+ (O Positivo)</option><option value="O_NEGATIVO">O- (O Negativo)</option>
                            <option value="A_POSITIVO">A+ (A Positivo)</option><option value="A_NEGATIVO">A- (A Negativo)</option>
                            <option value="B_POSITIVO">B+ (B Positivo)</option><option value="B_NEGATIVO">B- (B Negativo)</option>
                            <option value="AB_POSITIVO">AB+ (AB Positivo)</option><option value="AB_NEGATIVO">AB- (AB Negativo)</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Peso (Kg)</label><input type="number" id="peso" min="50" step="0.1" required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Teléfono</label><input type="text" id="telefono" required></div>
                    <div class="form-group"><label>Correo</label><input type="email" id="correo" required></div>
                </div>
                <div class="form-group"><label>Dirección</label><input type="text" id="direccion" required></div>

                <hr style="margin: 25px 0; border: 1px solid var(--border-color);">

                <h3>Firma de Consentimiento</h3>
                <div class="form-group" style="margin-top: 15px;">
                    <div class="toggle-group">
                        <button type="button" id="btnFirmaDibujar" class="toggle-btn active">Trazar Firma</button>
                        <button type="button" id="btnFirmaSubir" class="toggle-btn">Subir Documento</button>
                    </div>
                </div>

                <div id="wrapperCanvas" class="signature-box">
                    <canvas id="canvasFirma" width="450" height="200"></canvas>
                    <br><button type="button" id="btnClearCanvas" class="btn btn-outline" style="margin-top: 15px;"><i class="fa-solid fa-eraser"></i> Limpiar Trazo</button>
                </div>

                <div id="wrapperArchivo" class="signature-box" style="display: none; padding: 40px;">
                    <i class="fa-solid fa-cloud-arrow-up" style="font-size: 3rem; color: #94a3b8; margin-bottom: 15px;"></i>
                    <h4>Sube el archivo escaneado</h4>
                    <input type="file" id="archivoFirma" accept="image/*" style="margin-top: 15px;">
                </div>

                <button type="submit" class="btn btn-primary w-full" style="margin-top: 20px;"><i class="fa-solid fa-save"></i> Registrar Donante y Firma</button>
                <p id="donanteMsg" class="form-msg"></p>
            </form>
        </div>

    </div>

    <h3>Directorio de Donantes</h3>
    <div class="data-table-container">
        <table class="data-table">
            <thead><tr><th>ID</th><th>Documento</th><th>Nombre</th><th>Sangre</th><th>Teléfono</th></tr></thead>
            <tbody id="tablaDonantesBody"></tbody>
        </table>
    </div>
</main>
<script src="/static/js/app.js"></script>
</body>
</html>
