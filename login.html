<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - MediSign</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
<div class="login-card">
    <div class="login-header">
        <i class="fa-solid fa-user-doctor icon"></i>
        <h2>Bienvenido</h2>
        <p>Ingresa tus credenciales para continuar</p>
    </div>
    <form id="loginForm">
        <div class="form-group">
            <label>Correo Electrónico</label>
            <div class="input-wrapper"><i class="fa-solid fa-envelope"></i><input type="email" id="email" required></div>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <div class="input-wrapper"><i class="fa-solid fa-lock"></i><input type="password" id="password" required></div>
        </div>
        <button type="submit" class="btn btn-primary w-full">Iniciar Sesión</button>
        <p id="loginMsg" class="form-msg"></p>
    </form>
</div>
<script src="/static/js/app.js"></script>
</body>
</html>
